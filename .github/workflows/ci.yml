name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and component system
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Install Storybook browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, component, and accessibility tests
        run: pnpm test

      - name: Storybook browser tests
        run: pnpm test:storybook

      - name: Storybook static build
        run: pnpm build:storybook

      - name: Application build
        run: pnpm build

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Install browser and OS dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run technical smoke suite
        run: pnpm test:e2e -- --project=${{ matrix.browser }}

  postgres-integration:
    name: PostgreSQL 18 integration and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: bidly_test
          POSTGRES_USER: bidly
          POSTGRES_PASSWORD: bidly_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidly -d bidly_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://bidly:bidly_test_only@127.0.0.1:5432/bidly_test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL integration suite
        run: pnpm test:integration

  containers:
    name: OCI build and scan (${{ matrix.target }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [web-runtime, api-runtime]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image without publishing
        run: docker build --target ${{ matrix.target }} --tag bidly-${{ matrix.target }}:ci .

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bidly-${{ matrix.target }}:ci
          trivy-version: v0.74.0
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: HIGH,CRITICAL
